services:
  postgres:
    image: postgres:15-alpine
    container_name: aramco_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-aramco_etl}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgrespassword}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql
      - ./sql/indexes.sql:/docker-entrypoint-initdb.d/20_indexes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-aramco_etl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl_app:
    build: .
    container_name: aramco_etl_app
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  grafana:
    image: grafana/grafana:latest
    container_name: aramco_grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-adminpassword}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards


    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data:


